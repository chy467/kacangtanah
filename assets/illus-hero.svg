
<!-- Simple pastel futuristic hero illustration (SVG) -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#F5FBFF"/>
      <stop offset="1" stop-color="#EAF7FF"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0" stop-color="#0B6FFF"/>
      <stop offset="1" stop-color="#8AC6FF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <g transform="translate(80,60)">
    <rect x="20" y="30" width="480" height="300" rx="20" fill="url(#g1)" opacity="0.12"/>
    <circle cx="420" cy="60" r="40" fill="#CDE9FF" opacity="0.9"/>
    <rect x="520" y="120" width="420" height="260" rx="20" fill="#fff" opacity="0.85" />
    <g transform="translate(560,150)" fill="#8AC6FF" opacity="0.95">
      <rect x="0" y="0" width="220" height="18" rx="8"></rect>
      <rect x="0" y="36" width="160" height="12" rx="6"></rect>
    </g>
  </g>
</svg>